# This workflow will install IC and run all the tests with pytest

name: Test suite

on:
  push:
  pull_request:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8]
        #platform: [ubuntu-18.04, macos-latest]
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4

    - name: tmate
      uses: mxschmitt/action-tmate@v3

    - name: Get LFS files
      run: git lfs pull

    # - name: Fix Conda permissions on macOS
    #   run: sudo chown -R $UID $CONDA
    #   if: runner.os == 'macOS'

    - name: HACK! remove default conda
      # the default conda gives us trouble, kill it
      run: sudo unlink /usr/bin/conda

    - name: Install IC
      run: |
        cd ..
        git clone https://github.com/next-exp/IC.git
        cd IC
        git checkout origin/v2
        bash manage.sh install ${{ matrix.python-version }}

    - name: Run tests
      run: |
        # remove conda from path so we use our own conda
        export PATH=`echo $PATH | tr ":" "\n" | grep -v "conda" | tr "\n" ":"`
        cd ..
        source $CONDA/etc/profile.d/conda.sh
        cd IC
        source manage.sh work_in_python_version_no_tests ${{ matrix.python-version }}
        cd ../ICAROS
        source icaro_setup.sh
        PYTEST_ADDOPTS=--color=yes HYPOTHESIS_PROFILE=travis-ci pytest -v
